<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coach Hal’s Countdown</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{
  --field:#1f6b34; --field2:#175a2a; --line:rgba(255,255,255,.14); --chalk:#f6f4ee;
  --board:#10151c; --led:#ffb627; --dim:#8c97a6; --btn:#ffb627; --btnInk:#10151c;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--field:#154d27;--field2:#0f3d1e;--line:rgba(255,255,255,.1);}
}
:root[data-theme="dark"]{--field:#154d27;--field2:#0f3d1e;--line:rgba(255,255,255,.1);}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{
  margin:0;height:100%;color:var(--chalk);text-align:center;overflow:hidden;
  font-family:"Bebas Neue",Impact,"Arial Narrow",sans-serif;letter-spacing:.04em;
  background:
    radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.35) 100%),
    repeating-linear-gradient(90deg,var(--line) 0 3px,transparent 3px 90px),
    repeating-linear-gradient(90deg,var(--field) 0 90px,var(--field2) 90px 180px);
  display:flex;align-items:center;justify-content:center;padding:20px;
}
main{width:100%;max-width:680px;position:relative;z-index:2}
h1{margin:0;font-weight:400;font-size:clamp(2rem,9vw,3.6rem);text-shadow:0 3px 0 rgba(0,0,0,.35)}
.sub{font-size:clamp(1rem,4vw,1.4rem);opacity:.85;margin:2px 0 8px}
.ball-wrap{width:clamp(110px,28vw,170px);margin:0 auto 14px;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px) rotate(4deg)}}
#ball{width:100%;display:block;cursor:pointer;filter:drop-shadow(0 8px 6px rgba(0,0,0,.4))}
.board{background:var(--board);border:4px solid #2b3441;border-radius:14px;padding:18px 12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.tiles{display:flex;justify-content:center;gap:clamp(8px,3vw,22px)}
.tile b{display:block;min-width:2ch;font-weight:400;font-size:clamp(2.6rem,13vw,5.5rem);line-height:1;color:var(--led);text-shadow:0 0 14px rgba(255,182,39,.55);font-variant-numeric:tabular-nums}
.tile span{font-size:clamp(.9rem,3.4vw,1.2rem);color:var(--dim)}
.when{margin:12px 0 0;font-size:clamp(1rem,3.8vw,1.3rem);opacity:.9}
#replay{display:none;margin-top:14px;font:inherit;font-size:1.2rem;background:var(--btn);color:var(--btnInk);border:0;border-radius:8px;padding:8px 18px;cursor:pointer}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<main>
  <h1 id="title">Finish Line</h1>
  <div class="sub" id="sub">The final whistle is coming, Coach</div>
  <div class="ball-wrap">
    <svg id="ball" viewBox="-52 -36 104 72" aria-label="American football">
      <defs><clipPath id="c"><path d="M-48 0C-30-32 30-32 48 0C30 32-30 32-48 0Z"/></clipPath></defs>
      <path d="M-48 0C-30-32 30-32 48 0C30 32-30 32-48 0Z" fill="#7a3b12" stroke="#3b1a07" stroke-width="3"/>
      <g clip-path="url(#c)" fill="#fff"><rect x="-35" y="-34" width="5" height="68"/><rect x="30" y="-34" width="5" height="68"/></g>
      <g stroke="#fff" stroke-width="2.4" stroke-linecap="round">
        <path d="M-17 0H17"/><path d="M-12-7V7M-6-7V7M0-7V7M6-7V7M12-7V7"/>
      </g>
    </svg>
  </div>
  <div class="board" id="board">
    <div class="tiles">
      <div class="tile"><b id="d">--</b><span>DAYS</span></div>
      <div class="tile"><b id="h">--</b><span>HRS</span></div>
      <div class="tile"><b id="m">--</b><span>MIN</span></div>
      <div class="tile"><b id="s">--</b><span>SEC</span></div>
    </div>
  </div>
  <p class="when" id="when"></p>
  <button id="replay" type="button">Preview the pop</button>
</main>
<script>
// EDIT THIS: year, month (0 = January, so 10 = November), day, hour (24h), minute
var target = new Date(2026, 10, 28, 18, 0, 0);

var $ = function(id){ return document.getElementById(id); };
var ball = $("ball"), cv = $("fx"), ctx = cv.getContext("2d");
var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var done = false, parts = [], running = false;

$("when").textContent = "Final whistle: " + target.toLocaleString(undefined, {
  weekday:"long", day:"numeric", month:"long", hour:"2-digit", minute:"2-digit"
});

// pre-render one mini football for the particles
var sprite = document.createElement("canvas");
sprite.width = 100; sprite.height = 64;
(function(){
  var g = sprite.getContext("2d"); g.translate(50, 32);
  var body = new Path2D("M-46 0C-29-30 29-30 46 0C29 30-29 30-46 0Z");
  g.fillStyle = "#7a3b12"; g.fill(body);
  g.save(); g.clip(body); g.fillStyle = "#fff";
  g.fillRect(-34,-32,5,64); g.fillRect(29,-32,5,64); g.restore();
  g.lineWidth = 3; g.strokeStyle = "#3b1a07"; g.stroke(body);
  g.strokeStyle = "#fff"; g.lineWidth = 2.4; g.lineCap = "round"; g.beginPath();
  g.moveTo(-16,0); g.lineTo(16,0);
  for (var x = -12; x <= 12; x += 6){ g.moveTo(x,-7); g.lineTo(x,7); }
  g.stroke();
})();

function resize(){
  var r = window.devicePixelRatio || 1;
  cv.width = innerWidth * r; cv.height = innerHeight * r;
  ctx.setTransform(r,0,0,r,0,0);
}
addEventListener("resize", resize); resize();

function spawn(n, cx, cy){
  for (var i = 0; i < n; i++){
    var a = Math.random() * Math.PI * 2, sp = 5 + Math.random() * 15;
    parts.push({
      x:cx, y:cy, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 4,
      r:Math.random()*6.28, vr:(Math.random()-.5)*.4,
      w:16 + Math.random()*30, life:0, max:110 + Math.random()*70
    });
  }
  if (!running){ running = true; requestAnimationFrame(frame); }
}

function frame(){
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  parts = parts.filter(function(p){ return p.life < p.max && p.y < innerHeight + 60; });
  parts.forEach(function(p){
    p.life++; p.vy += .28; p.vx *= .992; p.x += p.vx; p.y += p.vy; p.r += p.vr;
    ctx.save();
    ctx.globalAlpha = Math.min(1, (p.max - p.life) / 30);
    ctx.translate(p.x, p.y); ctx.rotate(p.r);
    ctx.drawImage(sprite, -p.w/2, -p.w*.32, p.w, p.w*.64);
    ctx.restore();
  });
  if (parts.length){ requestAnimationFrame(frame); }
  else { running = false; ctx.clearRect(0, 0, innerWidth, innerHeight); }
}

function pop(){
  ball.getAnimations().forEach(function(a){ a.cancel(); });
  var r = ball.getBoundingClientRect();
  var cx = r.left + r.width/2, cy = r.top + r.height/2;
  var wob = ball.animate([
    {transform:"rotate(0) scale(1)"},
    {transform:"rotate(-12deg) scale(1.1)"},
    {transform:"rotate(12deg) scale(1.25)"},
    {transform:"rotate(-8deg) scale(1.5)"},
    {transform:"rotate(0) scale(1.9)", opacity:1, offset:.9},
    {transform:"rotate(0) scale(2.4)", opacity:0}
  ], {duration: reduced ? 1 : 900, fill:"forwards", easing:"ease-in"});
  wob.onfinish = function(){
    var n = reduced ? 30 : 130;
    spawn(n, cx, cy);
    setTimeout(function(){ spawn(Math.round(n/2), cx, cy); }, 350);
    setTimeout(function(){
      ball.animate([{transform:"scale(0)",opacity:0},{transform:"scale(1)",opacity:1}],
        {duration:500, fill:"forwards", easing:"ease-out"});
    }, 1800);
  };
}
ball.addEventListener("click", function(){ if (done || location.hash === "#preview") pop(); });

function finish(){
  if (done) return;
  done = true;
  $("title").textContent = "Hal is free!";
  $("sub").textContent = "Contract complete \u2013 tap the football for another pop";
  $("board").style.display = "none";
  pop();
}

function tick(){
  var ms = target - new Date();
  if (ms <= 0){ finish(); return; }
  var t = Math.floor(ms / 1000);
  $("d").textContent = Math.floor(t / 86400);
  $("h").textContent = String(Math.floor(t % 86400 / 3600)).padStart(2, "0");
  $("m").textContent = String(Math.floor(t % 3600 / 60)).padStart(2, "0");
  $("s").textContent = String(t % 60).padStart(2, "0");
}
tick();
var timer = setInterval(function(){ tick(); if (done) clearInterval(timer); }, 1000);

// Owner preview: open the page with #preview on the end of the link
if (location.hash === "#preview"){
  $("replay").style.display = "inline-block";
  $("replay").addEventListener("click", pop);
}
</script>
</body>
</html>
